<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work From Home Registration</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600") center center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.overlay{
width:100%;
min-height:100vh;
background:rgba(0,0,0,0.45);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.96);
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
text-align:center;
color:#007bff;
margin-bottom:10px;
font-size:30px;
}

p{
text-align:center;
margin-bottom:20px;
color:#555;
}

input,select{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
outline:none;
}

input:focus,select:focus{
border-color:#007bff;
}

button{
width:100%;
padding:15px;
background:#00b4ff;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0094d6;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.footer{
margin-top:15px;
text-align:center;
font-size:13px;
color:#777;
}
</style>

</head>

<body>

<div class="overlay">

<div class="container">

<h2>💼 Work From Home</h2>

<p>Fill the form below to Apply</p>

<form id="myForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="mobile" placeholder="Mobile Number" maxlength="10" required>

<input type="text" id="city" placeholder="City" required>

<select id="qualification" required>
<option value="">Select Qualification</option>
<option>10th Pass</option>
<option>12th Pass</option>
<option>Graduate</option>
<option>Post Graduate</option>
<option>Other</option>
</select>

<button id="submitBtn" type="submit">🚀 Apply Now</button>

</form>

<div id="msg"></div>

<div class="footer">
🔒 Your information is kept secure.
</div>

</div>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbxZ8jpYrme5xiiT6Mx7xgV2VYYudCXG0RyVcDfX6SRZxa1YC14oubKAAykaY9FtmnYV-w/exec";

const form=document.getElementById("myForm");
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("msg");

let submitting=false;

form.addEventListener("submit",function(e){

e.preventDefault();

if(submitting) return;

submitting=true;

btn.disabled=true;
btn.innerHTML="Submitting...";

fetch(scriptURL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
name:document.getElementById("name").value,
mobile:document.getElementById("mobile").value,
city:document.getElementById("city").value,
qualification:document.getElementById("qualification").value
})
})

.then(res=>res.json())

.then(data=>{

msg.style.color="green";
msg.innerHTML="✅ Submitted Successfully!";

form.reset();

})

.finally(()=>{

btn.disabled=false;
btn.innerHTML="🚀 Apply Now";
submitting=false;

});

});

</script>

</body>
</html>
